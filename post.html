  <!--
    Script inline: aplica el tema ANTES de pintar cualquier pixel.
    Evita el "flash" de tema incorrecto al recargar la página.
    Valores: 'dark' | 'light' | null=Sistema (prefers-color-scheme)
  -->
  <script>
    (function() {
      var saved = localStorage.getItem('ecolinces_theme');
      var dark;
      if (saved === 'dark')       dark = true;
      else if (saved === 'light') dark = false;
      else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>

  <!-- MODAL AUTH -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-header" id="modalHeader">
        <span id="modalHeading">¡Bienvenido de vuelta!</span>
      </div>
      <div class="modal-tabs">
        <button class="tab active" data-tab="login">Iniciar sesión</button>
        <button class="tab" data-tab="register">Registrarse</button>
      </div>
      <div class="tab-content active" id="tabLogin">
        <input type="email"    id="loginEmail"    placeholder="Correo electrónico" />
        <input type="password" id="loginPassword" placeholder="Contraseña" />
        <button class="btn-submit" id="btnDoLogin">Entrar</button>
        <p class="auth-error" id="loginError"></p>
      </div>
      <div class="tab-content" id="tabRegister">
        <input type="text"     id="regUsername" placeholder="Nombre de usuario" />
        <input type="email"    id="regEmail"    placeholder="Correo electrónico" />
        <div class="password-wrap">
          <input type="password" id="regPassword" placeholder="Contraseña (mín. 6 caracteres)" />
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
        <button class="btn-submit" id="btnDoRegister">Crear cuenta</button>
        <p class="auth-error" id="registerError"></p>
      </div>
    </div>
