<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d4a2e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a2e1a" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EcoLinces" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artículo — EcoLinces</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="blog.css" />
  <link rel="stylesheet" href="styles_bento.css" />
  <link rel="stylesheet" href="post.css" />
  <link rel="stylesheet" href="search.css" />
  <link rel="stylesheet" href="chat.css" />
  <!--
    Script inline: aplica el tema ANTES de pintar cualquier pixel.
    Evita el "flash" de tema incorrecto al recargar la página.
    Valores: 'dark' | 'light' | null=Sistema (prefers-color-scheme)
  -->
  <script>
    (function() {
      var saved = localStorage.getItem('ecolinces_theme');
      var dark;
      if (saved === 'dark')       dark = true;
      else if (saved === 'light') dark = false;
      else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>

    @@include('_nav.html')



  <!-- CONTENIDO DEL ARTÍCULO -->
  <article id="postArticle">
    <!-- Se llena dinámicamente -->
    <div class="post-loading">
      <div class="skel-cover"></div>
      <div class="post-body">
        <div class="skel-line wide"></div>
        <div class="skel-line medium"></div>
        <div class="skel-line narrow"></div>
      </div>
    </div>
  </article>

  <!-- SECCIÓN DE COMENTARIOS -->
  <section class="comments-section" id="commentsSection" style="display:none">
    <div class="comments-inner">
      <h2 class="comments-title">Comentarios <span id="commentCount"></span></h2>

      <!-- Formulario nuevo comentario -->
      <div class="comment-form" id="commentForm">
        <textarea id="commentInput" placeholder="Escribe un comentario..." rows="3"></textarea>
        <div class="comment-form-footer">
          <span class="comment-form-hint" id="commentHint">Inicia sesión para comentar</span>
          <button class="btn-comment" id="btnSubmitComment" disabled>Publicar</button>
        </div>
      </div>

      <!-- Ordenar -->
      <div class="comments-sort">
        <button class="sort-btn active" data-sort="new">Más recientes</button>
        <button class="sort-btn" data-sort="top">Más votados</button>
      </div>

      <!-- Lista de comentarios -->
      <div id="commentsList"></div>
    </div>
  </section>

  <footer>© 2026 ECOLINCES</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="sb.js"></script>
  <script src="auth.js"></script>
  <script src="search.js"></script>
  <script src="chat.js"></script>
  <script src="post.js"></script>
  <script src="darkmode.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
