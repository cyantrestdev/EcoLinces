<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d4a2e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a2e1a" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EcoLinces" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artículo — EcoLinces</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="blog.css" />
  <link rel="stylesheet" href="styles_bento.css" />
  <link rel="stylesheet" href="post.css" />
  <link rel="stylesheet" href="search.css" />
  <link rel="stylesheet" href="chat.css" />
  <!--
    Script inline: aplica el tema ANTES de pintar cualquier pixel.
    Evita el "flash" de tema incorrecto al recargar la página.
    Valores: 'dark' | 'light' | null=Sistema (prefers-color-scheme)
  -->
  <script>
    (function() {
      var saved = localStorage.getItem('ecolinces_theme');
      var dark;
      if (saved === 'dark')       dark = true;
      else if (saved === 'light') dark = false;
      else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>

    <!-- NAV -->
  <nav id="navbar" class="visible scrolled">
        <button class="hamburger" id="hamburger" aria-label="Abrir menú">
      <!-- Estado sin sesión: 3 líneas -->
      <span class="ham-line"></span><span class="ham-line"></span><span class="ham-line"></span>
      <!-- Estado con sesión: foto de perfil (JS la activa) -->
      <img class="ham-avatar" id="hamAvatar" src="" alt="Mi perfil" style="display:none" />
    </button>
    <a class="logo" href="index.html"><img src="logo.svg" alt="" class="logo-icon" aria-hidden="true">EcoLinces</a>

    <!-- Grupo derecho: links + avatar -->
    <div class="nav-right-group">
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="blog.html">EcoBlog</a>
        <a href="quienes.html">¿Quiénes somos?</a>
        <a href="https://www.instagram.com/" target="_blank" rel="noopener">Contáctanos</a>
      </div>
      </div>
  </nav>

  <!-- MENÚ FULLSCREEN -->
  <div class="fullmenu" id="fullMenu" role="dialog" aria-label="Menú de navegación" aria-modal="true">
    <button class="fullmenu-close" id="fullMenuClose" aria-label="Cerrar menú">✕</button>

    <div class="fullmenu-left">

      <!-- Perfil del usuario → lleva a perfil.html al tocar -->
      <a class="drawer-profile" id="drawerProfile" href="perfil.html" style="display:none; text-decoration:none;">
        <img class="drawer-avatar" id="drawerAvatar" src="" alt="Avatar" />
        <div class="drawer-user-info">
          <span class="drawer-username" id="drawerUsername">—</span>
          <span class="drawer-email"    id="drawerEmail">—</span>
        </div>
      </a>

      <div class="drawer-divider"></div>

      <!-- Navegación -->
      <ul>
        <li><a href="index.html"   data-color="#2e7d32">Inicio</a></li>
        <li><a href="blog.html"    data-color="#e65100">EcoBlog</a></li>
        <li><a href="quienes.html" data-color="#1565c0">¿Quiénes somos?</a></li>
        <li><a href="https://www.instagram.com/ecolinces.dev" target="_blank" rel="noopener" data-color="#6a1b9a">Contáctanos</a></li>
      </ul>

      <div class="drawer-divider"></div>

      <!-- Cerrar sesión (solo con sesión activa) -->
      <button class="drawer-signout" id="drawerSignout" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>

      <!-- Iniciar sesión (solo sin sesión) -->
      <button class="drawer-login" id="drawerLogin" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Iniciar sesión
      </button>

    </div>
  </div>
  <div class="fullmenu-overlay" id="fullMenuOverlay"></div>

  <!-- MODAL AUTH -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-header" id="modalHeader">
        <span id="modalHeading">¡Bienvenido de vuelta!</span>
      </div>
      <div class="modal-tabs">
        <button class="tab active" data-tab="login">Iniciar sesión</button>
        <button class="tab" data-tab="register">Registrarse</button>
      </div>
      <div class="tab-content active" id="tabLogin">
        <input type="email"    id="loginEmail"    placeholder="Correo electrónico" />
        <input type="password" id="loginPassword" placeholder="Contraseña" />
        <button class="btn-submit" id="btnDoLogin">Entrar</button>
        <p class="auth-error" id="loginError"></p>
      </div>
      <div class="tab-content" id="tabRegister">
        <input type="text"     id="regUsername" placeholder="Nombre de usuario" />
        <input type="email"    id="regEmail"    placeholder="Correo electrónico" />
        <div class="password-wrap">
          <input type="password" id="regPassword" placeholder="Contraseña (mín. 6 caracteres)" />
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
        <button class="btn-submit" id="btnDoRegister">Crear cuenta</button>
        <p class="auth-error" id="registerError"></p>
      </div>
    </div>
  </div>

  <!-- CONTENIDO DEL ARTÍCULO -->
  <article id="postArticle">
    <!-- Se llena dinámicamente -->
    <div class="post-loading">
      <div class="skel-cover"></div>
      <div class="post-body">
        <div class="skel-line wide"></div>
        <div class="skel-line medium"></div>
        <div class="skel-line narrow"></div>
      </div>
    </div>
  </article>

  <!-- SECCIÓN DE COMENTARIOS -->
  <section class="comments-section" id="commentsSection" style="display:none">
    <div class="comments-inner">
      <h2 class="comments-title">Comentarios <span id="commentCount"></span></h2>

      <!-- Formulario nuevo comentario -->
      <div class="comment-form" id="commentForm">
        <textarea id="commentInput" placeholder="Escribe un comentario..." rows="3"></textarea>
        <div class="comment-form-footer">
          <span class="comment-form-hint" id="commentHint">Inicia sesión para comentar</span>
          <button class="btn-comment" id="btnSubmitComment" disabled>Publicar</button>
        </div>
      </div>

      <!-- Ordenar -->
      <div class="comments-sort">
        <button class="sort-btn active" data-sort="new">Más recientes</button>
        <button class="sort-btn" data-sort="top">Más votados</button>
      </div>

      <!-- Lista de comentarios -->
      <div id="commentsList"></div>
    </div>
  </section>

  <footer>© 2026 ECOLINCES</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="sb.js"></script>
  <script src="auth.js"></script>
  <script src="search.js"></script>
  <script src="chat.js"></script>
  <script src="post.js"></script>
  <script src="darkmode.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
