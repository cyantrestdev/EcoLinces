<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face {
        font-family: 'ClashDisplay';
        src: url('ClashDisplay-Semibold.otf') format('opentype');
        font-weight: 700;
      }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#a8d5a2"/>

  <!-- Puntos decorativos sutiles -->
  <circle cx="80"  cy="80"  r="6" fill="#1a1a1a" opacity="0.08"/>
  <circle cx="200" cy="40"  r="4" fill="#1a1a1a" opacity="0.06"/>
  <circle cx="40"  cy="200" r="5" fill="#1a1a1a" opacity="0.07"/>
  <circle cx="1120" cy="80"  r="6" fill="#1a1a1a" opacity="0.08"/>
  <circle cx="1000" cy="40"  r="4" fill="#1a1a1a" opacity="0.06"/>
  <circle cx="1160" cy="200" r="5" fill="#1a1a1a" opacity="0.07"/>
  <circle cx="80"  cy="550" r="6" fill="#1a1a1a" opacity="0.08"/>
  <circle cx="200" cy="590" r="4" fill="#1a1a1a" opacity="0.06"/>
